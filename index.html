<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iNaturalist Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>iNaturalist Share</h1>
    <div class="form-row">
    <input type="text" id="observation-url" placeholder="Paste observation URL">
    <select id="language-select">
        <option value="en" selected>EN</option>
        <option value="ru">RU</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="de">DE</option>
        <option value="nl">NL</option>
        <option value="zh">中文</option>
    </select>
    </div>
    <button id="fetch-btn">Generate Image</button>

    <!-- Container for displaying the final image -->
    <div id="image-container"></div>

    <canvas id="observation-canvas" style="display:none;"></canvas>

    <script src="script.js"></script>
</body>
</html>
